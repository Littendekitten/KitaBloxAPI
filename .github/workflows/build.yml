
name: Build KitaBloxAPI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile Fabric Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project structure
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Project files ==="
          find . -maxdepth 4 -type f \
            -not -path './.git/*' | sort | head -300
          echo "=== Gradle configuration files ==="
          find . -maxdepth 4 -type f \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \) -print

      - name: List Gradle tasks
        run: gradle tasks --all --no-daemon

      - name: Build mod
        run: gradle :build --no-daemon --stacktrace

      - name: Find generated JAR files
        if: always()
        run: |
          echo "=== All generated JAR files ==="
          find . -type f -name "*.jar" \
            -not -path './.git/*' -print
          echo "=== Build directories ==="
          find . -type d -name build \
            -not -path './.git/*' -print
          echo "=== Expected output directory ==="
          ls -lah build/libs/ || true

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KitaBloxAPI-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
